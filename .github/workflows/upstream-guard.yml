name: Upstream guard

# Two invariants that keep this fork maintainable:
#
#   1. No remote may be able to push to cloudreve/Cloudreve. The pre-push hook stops a
#      push from a configured clone, but it lives in local git config and cannot be
#      enforced for every clone, so it is checked here too.
#   2. The repository must keep a shared git ancestor with upstream. Losing it turns every
#      future upstream merge into a reconciliation of unrelated trees.
#
# See UPSTREAM_POLICY.md for the policy and UPGRADING.md for the merge procedure.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The upstream release this fork descends from. Recorded in UPGRADING.md.
  UPSTREAM_BASELINE: a8becb9f5b226024c83230bc52857c04966e2c30

jobs:
  no-upstream-target:
    name: Reject upstream push targets
    runs-on: ubuntu-latest
    steps:
      # Full history is required: the ancestry check below has to walk back to the
      # baseline commit.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A remote that only fetches from upstream is both safe and necessary: the fork
      # needs the upstream objects to keep a shared git ancestor, so merges stay
      # three-way instead of conflicting across unrelated histories. What must never
      # exist is a push target, which is what this checks for.
      - name: Fail if any remote can push to upstream
        run: |
          set -euo pipefail

          upstream="cloudreve/cloudreve"
          fail=0

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            key="${line%% *}"
            value="${line#* }"
            lower_key=$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')
            lower_value=$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')

            case "$lower_key" in
              remote.*.url|remote.*.pushurl) ;;
              *) continue ;;
            esac

            printf '%s' "$lower_value" | grep -q "$upstream" || continue

            # A pushurl that does not resolve to upstream disables pushing entirely,
            # which is exactly the fetch-only mirror this repository is allowed to have.
            if [ "${lower_key##*.}" = "pushurl" ]; then
              echo "::error::$key resolves to upstream ($value); that is a push target."
              fail=1
              continue
            fi

            # No override: the plain url doubles as the push url, so it must be one that
            # refuses to push.
            if printf '%s' "$lower_value" | grep -q "no-push"; then
              echo "$key is a fetch-only mirror ($value)."
            else
              echo "::error::$key points at upstream ($value) with no pushurl override, so"
              echo "git would be able to push there. See UPSTREAM_POLICY.md."
              fail=1
            fi
          done < <(git config --local --list || true)

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "No remote points at upstream."

      # The value of this repository depends on being able to merge upstream releases as
      # ordinary three-way merges. That requires upstream to remain an ancestor; when the
      # link is lost, the failure is silent and only surfaces months later as an
      # unmergeable tree, so it is asserted on every push instead.
      - name: Require a shared ancestor with upstream
        run: |
          set -euo pipefail

          head=$(git rev-parse HEAD)
          echo "checking $head"

          baseline="$UPSTREAM_BASELINE"
          if [ -n "$baseline" ] && git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$baseline" "$head"; then
              echo "baseline $baseline is an ancestor of $head"
            else
              echo "::error::the upstream baseline $baseline is not an ancestor of $head."
              echo "The history was rewritten or upstream sources were re-imported instead"
              echo "of merged. Follow 'Merging an upstream release' in UPGRADING.md."
              exit 1
            fi
          fi

          # Reaching the upstream default branch is the stronger statement, and it is what
          # holds once upstream work has been merged at least once. It cannot be checked
          # when upstream is unreachable, so that case is reported rather than failed.
          git remote add upstream https://github.com/cloudreve/Cloudreve.git 2>/dev/null || true
          if git fetch --no-tags --quiet --depth 1 upstream master 2>/dev/null; then
            upstream_head=$(git rev-parse FETCH_HEAD)
            if git merge-base --is-ancestor "$upstream_head" "$head"; then
              echo "upstream/master ($upstream_head) is an ancestor of $head"
            else
              base=$(git merge-base "$upstream_head" "$head" 2>/dev/null || true)
              if [ -z "$base" ]; then
                echo "::error::no merge base with upstream/master: the shared ancestor is gone."
                echo "See 'Merging an upstream release' in UPGRADING.md before changing history."
                exit 1
              fi
              echo "::notice::upstream has moved on (merge base $base); this is expected"
              echo "between merges and is resolved by the procedure in UPGRADING.md."
            fi
          else
            echo "::notice::could not reach upstream to compare; the baseline check above still applies."
          fi

      - name: Fail if a pull request targets upstream
        if: github.event_name == 'pull_request'
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          lower=$(printf '%s' "$BASE_REPO" | tr '[:upper:]' '[:lower:]')
          if [ "$lower" = "cloudreve/cloudreve" ]; then
            echo "::error::This pull request targets upstream ($BASE_REPO). Close it: this fork never publishes upstream."
            exit 1
          fi
          echo "Pull request targets $BASE_REPO, not upstream."
