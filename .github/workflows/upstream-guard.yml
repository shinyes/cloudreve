name: Upstream guard

# This fork must never publish to cloudreve/Cloudreve. The pre-push hook stops a push
# from a configured clone, but it lives in local git config and cannot be enforced for
# every clone, so the invariant is also checked here on every push and pull request.
#
# See UPSTREAM_POLICY.md for the full policy and the supported ways to reuse upstream
# code without registering a push target.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-upstream-target:
    name: Reject upstream push targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # A remote that only fetches from upstream is both safe and necessary: the fork
      # needs the upstream objects to keep a shared git ancestor, so merges stay
      # three-way instead of conflicting across unrelated histories. What must never
      # exist is a push target, which is what this checks for.
      - name: Fail if any remote can push to upstream
        run: |
          set -euo pipefail

          upstream="cloudreve/cloudreve"
          fail=0

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            key="${line%% *}"
            value="${line#* }"
            lower_key=$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')
            lower_value=$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')

            case "$lower_key" in
              remote.*.url|remote.*.pushurl) ;;
              *) continue ;;
            esac

            printf '%s' "$lower_value" | grep -q "$upstream" || continue

            # A pushurl that does not resolve to upstream disables pushing entirely,
            # which is exactly the fetch-only mirror this repository is allowed to have.
            if [ "${lower_key##*.}" = "pushurl" ]; then
              echo "::error::$key resolves to upstream ($value); that is a push target."
              fail=1
              continue
            fi

            # No override: the plain url doubles as the push url, so it must be one that
            # refuses to push.
            if printf '%s' "$lower_value" | grep -q "no-push"; then
              echo "$key is a fetch-only mirror ($value)."
            else
              echo "::error::$key points at upstream ($value) with no pushurl override, so"
              echo "git would be able to push there. See UPSTREAM_POLICY.md."
              fail=1
            fi
          done < <(git config --local --list || true)

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "No remote points at upstream."

      - name: Fail if a pull request targets upstream
        if: github.event_name == 'pull_request'
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          lower=$(printf '%s' "$BASE_REPO" | tr '[:upper:]' '[:lower:]')
          if [ "$lower" = "cloudreve/cloudreve" ]; then
            echo "::error::This pull request targets upstream ($BASE_REPO). Close it: this fork never publishes upstream."
            exit 1
          fi
          echo "Pull request targets $BASE_REPO, not upstream."
