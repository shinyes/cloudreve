name: Release container images

# Tags matching x.y.z (for example 4.16.0) publish:
#   * a multi-arch image (linux/amd64 + linux/arm64) to ghcr.io,
#   * one compressed `docker save` archive per architecture attached to the release.
#
# The tag doubles as the reported backend version, so it must not carry a leading
# "v": application/statics compares the version embedded in the frontend bundle
# against constants.BackendVersion and refuses to serve a mismatched UI.
#
# This workflow deliberately uses NO `actions/upload-artifact`. Artifact storage is an
# account-wide quota of a few hundred megabytes, while two image archives plus the
# frontend bundle are well over 100MB per run, so a single run could consume the whole
# allowance and make every later run fail with "Artifact storage quota has been hit"
# before any build step mattered. Release assets are outside that quota, so the frontend
# bundle is built inside the job that needs it and the archives are attached to the
# release directly from the job that produced them.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  # The image is published under the repository owner so a fork pushes to its own
  # namespace instead of trying to write to the upstream package.
  IMAGE: ghcr.io/${{ github.repository_owner }}/cloudreve
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  # The archives are attached to the release straight from the job that builds them
  # (release assets are outside the Actions artifact quota). `gh release upload` needs
  # the release to exist first, so it is created here as a draft: if a build later
  # fails, the tag is left with an unpublished draft instead of a half-empty release.
  ensure-release:
    name: Create the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
              --notes "Built from tag $GITHUB_REF_NAME."
            echo "created draft release $GITHUB_REF_NAME"
          fi

  image:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: assets/yarn.lock

      - name: Install frontend dependencies
        working-directory: assets
        run: yarn install --frozen-lockfile --network-timeout 1000000

      # `npm run build` rather than `build-prod`: the latter runs tsc first, and the
      # repository carries unrelated pre-existing type errors that would fail the
      # release. Vite performs the actual bundling either way.
      - name: Build frontend bundle
        working-directory: assets
        env:
          # 8GB is what the local build script uses, but GitHub runners have less.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      # statics.go refuses to start when version.json and the compiled backend version
      # disagree, so the file has to carry the release tag.
      - name: Stamp the frontend version
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME;
            fs.writeFileSync('assets/build/version.json', JSON.stringify({ name: 'cloudreve-frontend', version }));
            console.log('version.json ->', version);
          "

      # The zip is embedded with //go:embed and unwrapped with fs.Sub(..., "assets/build"),
      # so every entry MUST carry that exact prefix. `zip -r build` from inside assets/
      # produces "build/..." entries instead, which fails at startup - the archive is
      # therefore written explicitly rather than left to the zip CLI's path handling.
      - name: Package assets.zip
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          root = "assets/build"
          target = "application/statics/assets.zip"
          prefix = "assets/build/"

          os.makedirs("application/statics", exist_ok=True)

          written = 0
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as z:
              for dirpath, _dirnames, filenames in os.walk(root):
                  for name in filenames:
                      full = os.path.join(dirpath, name)
                      # posix separators only: a backslash will not resolve in fs.Sub.
                      arcname = prefix + os.path.relpath(full, root).replace(os.sep, "/")
                      z.write(full, arcname)
                      written += 1

          with zipfile.ZipFile(target) as z:
              names = z.namelist()

          assert names, "the bundle is empty"
          assert not any("\\" in n for n in names), "zip entries must use forward slashes"
          outside = [n for n in names if not n.startswith(prefix)]
          assert not outside, f"{len(outside)} entries are not under {prefix}: {outside[:3]}"
          for required in ("assets/build/version.json", "assets/build/index.html"):
              assert required in names, f"{required} is missing from the bundle"
          print(f"{len(names)} entries ({written} written), all under {prefix}")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
            type=raw,value=v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  archives:
    name: Build downloadable archives
    # Must wait for the draft release: the archives are attached from here, and
    # `gh release upload` has nothing to attach to until it exists.
    needs: ensure-release
    runs-on: ubuntu-latest
    permissions:
      # Writing release assets needs contents: write on the default token.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: assets/yarn.lock

      - name: Install frontend dependencies
        working-directory: assets
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: Build frontend bundle
        working-directory: assets
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Stamp the frontend version
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME;
            fs.writeFileSync('assets/build/version.json', JSON.stringify({ name: 'cloudreve-frontend', version }));
          "

      - name: Package assets.zip
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          root = "assets/build"
          target = "application/statics/assets.zip"
          prefix = "assets/build/"

          os.makedirs("application/statics", exist_ok=True)

          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as z:
              for dirpath, _dirnames, filenames in os.walk(root):
                  for name in filenames:
                      full = os.path.join(dirpath, name)
                      arcname = prefix + os.path.relpath(full, root).replace(os.sep, "/")
                      z.write(full, arcname)

          with zipfile.ZipFile(target) as z:
              names = z.namelist()
          assert names and all(n.startswith(prefix) for n in names), "bad assets.zip layout"
          PY

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # A per-architecture build is loaded into the local daemon so it can be exported
      # with `docker save`; a multi-arch manifest cannot be saved as a single archive.
      # No QEMU here: the Dockerfile cross-compiles Go with TARGETARCH, so nothing is
      # executed for the foreign platform.
      - name: Build the image for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: cloudreve-release:${{ github.ref_name }}-${{ matrix.suffix }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha

      - name: Export and compress
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          name="cloudreve_${GITHUB_REF_NAME}_linux_${SUFFIX}"
          docker save "cloudreve-release:${GITHUB_REF_NAME}-${SUFFIX}" -o "${name}.tar"
          gzip -9 "${name}.tar"
          ls -lh "${name}.tar.gz"
          echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"

      # Straight onto the release: no artifact storage involved, and the file ends up
      # where users actually look for it. --clobber keeps a re-run idempotent, and
      # ensure-release guarantees the release already exists.
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber

  release:
    name: Publish the release
    needs: [image, archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The draft was created by ensure-release and the assets were attached by the
      # archives job. This step fills in the notes and publishes it, so a failure
      # earlier leaves an unpublished draft rather than a release that looks complete.
      - name: Publish with generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
